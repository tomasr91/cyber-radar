# CyberScope — nieuwsbronnen
# verification.status:
#   verified       = feed zelf gecontroleerd (een run leverde artikelen op)
#   user_supplied  = voorgesteld, nog niet met een echte run gecontroleerd; mag aan staan
#   to_verify      = placeholder; staat uit tot het adres is bevestigd
#
# region = waar de bron vandaan komt: nl, benelux, eu, na of world. Claude zet per artikel de regio
# van het nieuws zelf (region in de uitleg); de bronregio telt alleen als die ontbreekt.
# Voorrang: Nederland, dan Benelux, Europa, Noord-Amerika, rest van de wereld (interests.yml, region_bonus).

schema_version: 2
updated: "2026-11-03"

definitions:
  type:
    official_docs: Officiële adviezen, waarschuwingen en release notes (primaire bron)
    vendor_blog: Blog of onderzoeksteam van een securityleverancier
    expert_blog: Onafhankelijke onderzoekers en technische analyses
    technical_article: Technische artikelen en tutorials
    independent_news: Nieuwssites over cybersecurity (extra context, technische details checken)
  trust_level:
    high: Primaire bron of bewezen betrouwbaar; feiten mogen zonder tweede bron worden overgenomen
    medium: Betrouwbaar, maar interpretatie of commercieel belang; technische claims checken bij een primaire bron
    low: Alleen als signaal; nooit als enige bron voor een feit
  priority:
    description: >-
      Hoe zwaar een bron meetelt bij de selectie (1-5). Staat los van trust_level.
      De onderwerp-prioriteit uit interests.yml blijft leidend.
  fetch_method:
    rss: RSS-feed uitlezen (feed_url)
    atom: Atom-feed uitlezen (feed_url)
    html: Pagina ophalen en nieuwe items herkennen
    github_releases: Releases van een GitHub-repository volgen
    manual: Handmatig toevoegen, niet automatisch ophalen
  verification_status:
    verified: Feed zelf gecontroleerd op checked_on
    user_supplied: Voorgesteld; nog niet met een echte run gecontroleerd
    to_verify: Placeholder; niet gebruiken voordat het is bevestigd

